# Application identifier used by Spring Boot.
spring.application.name=digital-wallet

server.servlet.context-path=/api/v1

# PostgreSQL connection settings for the wallet database.
spring.datasource.url=jdbc:postgresql://localhost:5432/digitalwallet
spring.datasource.username=postgres
spring.datasource.password=postgres

# Keep the database schema synchronized with entities during development.
spring.jpa.hibernate.ddl-auto=update
# Disable SQL statement logging.
spring.jpa.show-sql=false

# Configure the maximum number of database connections in the HikariCP pool.
spring.datasource.hikari.maximum-pool-size=25
# Keep at least this many idle database connections available.
spring.datasource.hikari.minimum-idle=5

# Redis connection settings used for caching.
spring.data.redis.host:localhost
spring.data.redis.port:6379
# Maximum time to wait for a Redis operation to complete.
spring.data.redis.timeout:2000ms

# Retain idempotency keys in the cache for 24 hours.
idempotency.cache-ttl-seconds: 86400 

# OpenAI API key, supplied through the OPENAI_API_KEY environment variable.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Enable debug logs for Spring AI chat client advisors.
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.root=INFO
logging.level.com.digital.wallet=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.file.name=logs/digital-wallet.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

#Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

#Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

